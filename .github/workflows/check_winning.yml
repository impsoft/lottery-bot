name: Check Winning
on:
  schedule:
    - cron: 37 13 * * 6 # every Saturday 22:37 (KST). 정각은 GitHub 스케줄 지연이 심해 피함
  workflow_dispatch:

permissions:
  contents: read
  actions: write # keepalive: 스케줄 워크플로 자동 비활성화(60일) 방지

jobs:
  build:
    runs-on: [ubuntu-latest]
    name: Check Winning
    steps:  

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt

      - name: Run Scripts
        run: make check # or use 'make check_lotto' / 'make check_win720' for granular check
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: ${{ secrets.COUNT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Keep scheduled workflows alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in buy_lotto.yml check_winning.yml; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
